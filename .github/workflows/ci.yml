name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # 驗證 wrangler.jsonc 並實際 bundle 一次 Worker。不需要 API token，
      # 所以 PR 階段就能擋掉設定錯誤。前端沒有 build step，不需要 npm run build。
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

  # End-to-end（#173 / #183）：真的 Chromium 對本機 wrangler dev（空的 D1 + 假資料），
  # 檢查徽章顏色、杯測流程等 jsdom 看不到的行為。不需要任何 secret。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
