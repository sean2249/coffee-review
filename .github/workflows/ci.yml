name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # 驗證 wrangler.jsonc 並實際 bundle 一次 Worker。不需要 API token，
      # 所以 PR 階段就能擋掉設定錯誤。前端沒有 build step，不需要 npm run build。
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
