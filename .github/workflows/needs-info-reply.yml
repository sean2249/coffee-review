# Caller for the shared needs-info-reply workflow. Written by issue-workflow-setup.
# sean2249/skills is the <owner>/<repo> that hosts the reusable workflows; v3 is its latest release tag (v1, v2, …).
name: needs-info-reply

on:
  issue_comment:
    types: [created]
  issues:
    types: [edited]   # the author ticks Pending decisions boxes in the issue body

permissions:
  issues: write

jobs:
  needs-info-reply:
    uses: sean2249/skills/.github/workflows/needs-info-reply.yml@v4
