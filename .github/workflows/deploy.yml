name: Deploy

on:
  push:
    branches: [main]

# 一次只跑一個正式部署；新的 push 排隊而不是插隊。
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # 順序是硬性的：migration 先於 deploy，否則新 Worker 會打到舊 schema。
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply coffee-review --remote

      # 兩個值都空時 requireAccess 會走 open 分支 = 全站無防護。它們是 repo
      # variables（不敏感，所以刻意不是 secret），在這裡硬性檢查非空，fail closed。
      - name: Check Access variables
        run: |
          test -n "${{ vars.ACCESS_TEAM_DOMAIN }}" || { echo "vars.ACCESS_TEAM_DOMAIN is not set"; exit 1; }
          test -n "${{ vars.ACCESS_AUD }}" || { echo "vars.ACCESS_AUD is not set"; exit 1; }

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var ACCESS_TEAM_DOMAIN:${{ vars.ACCESS_TEAM_DOMAIN }} --var ACCESS_AUD:${{ vars.ACCESS_AUD }}
